name: Keepalive
on:
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: GET /leaderboard
        run: |
          curl -fsS "https://verse-dash-api.vercel.app/leaderboard" -o /tmp/leaderboard.json
          head -c 200 /tmp/leaderboard.json
          echo